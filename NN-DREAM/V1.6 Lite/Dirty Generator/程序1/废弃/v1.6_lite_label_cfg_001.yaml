defect_count:
  k_max: 5
  probs:
    "0": 0.30
    "1": 0.35
    "2": 0.20
    "3": 0.10
    "4": 0.04
    "5": 0.01

healthy_cases:
  cases:
    - case_id: ideal_light_noise
      weight: 0.20
    - case_id: global_epsilon_shift
      weight: 0.25
    - case_id: global_loss_shift
      weight: 0.20
    - case_id: near_residual
      weight: 0.15
    - case_id: end_boundary_shift
      weight: 0.10
    - case_id: weak_ripple_false_peak
      weight: 0.10

global_lite_params:
  delta_alpha_G:
    min: -0.10
    max: 0.10
  delta_epsilon_G:
    min: -0.05
    max: 0.05

global_full_params:
  delta_sigma_G:
    min: -0.03
    max: 0.03
  delta_tandelta_G:
    min: -0.05
    max: 0.08
  delta_g_G:
    min: -0.02
    max: 0.02

defect_position:
  near_exclusion_m: 5.0
  main_far_limit_frac: 0.95
  hard_far_limit_frac: 0.97
  allow_hard_far_cases: false
  bins:
    - start_frac: 0.00
      end_frac: 0.20
      weight: 0.20
    - start_frac: 0.20
      end_frac: 0.50
      weight: 0.30
    - start_frac: 0.50
      end_frac: 0.80
      weight: 0.30
    - start_frac: 0.80
      end_frac: 0.95
      weight: 0.20

defect_length:
  decimal_places: 1
  dz_ref_m: 0.45
  bins:
    - mode: absolute
      min_m: 0.2
      max_m: 0.45
      weight: 0.05
    - mode: dz_multiple
      min_k: 5
      max_k: 15
      weight: 0.40
    - mode: dz_multiple
      min_k: 15
      max_k: 30
      weight: 0.40
    - mode: absolute
      min_m: 20.0
      max_m: 80.0
      weight: 0.15

defect_collision:
  min_gap_m: 5.0
  max_rejection_trials: 200

defect_kinds:
  candidates:
    - kind: dielectric_constant
      weight: 0.20
      severity:
        min: 0.05
        max: 1.00
      lite_params:
        delta_alpha_eff:
          min: 0.00
          max: 0.05
        delta_epsilon_eff:
          min: -0.12
          max: 0.12
      full_params:
        delta_sigma:
          min: 0.00
          max: 0.00
        delta_tandelta:
          min: 0.00
          max: 0.04
        delta_g:
          min: 0.00
          max: 0.00

    - kind: dielectric_loss
      weight: 0.30
      severity:
        min: 0.05
        max: 1.00
      lite_params:
        delta_alpha_eff:
          min: 0.04
          max: 0.30
        delta_epsilon_eff:
          min: -0.06
          max: 0.06
      full_params:
        delta_sigma:
          min: 0.00
          max: 0.00
        delta_tandelta:
          min: 0.04
          max: 0.35
        delta_g:
          min: 0.00
          max: 0.00

    - kind: conductor_loss
      weight: 0.20
      severity:
        min: 0.05
        max: 1.00
      lite_params:
        delta_alpha_eff:
          min: 0.04
          max: 0.25
        delta_epsilon_eff:
          min: -0.03
          max: 0.03
      full_params:
        delta_sigma:
          min: -0.30
          max: -0.03
        delta_tandelta:
          min: 0.00
          max: 0.08
        delta_g:
          min: 0.00
          max: 0.00

