      severity:
        min: 0.05
        max: 1.00
      lite_params:
        delta_alpha_eff:
          min: 0.02
          max: 0.20
        delta_epsilon_eff:
          min: -0.08
          max: 0.08
      full_params:
        delta_sigma:
          min: -0.05
          max: 0.05
        delta_tandelta:
          min: 0.00
          max: 0.10
        delta_g:
          min: -0.20
          max: 0.20



near_end_cases:
  candidates:
    - near_case_id: near_001
      weight: 1.0
      R_N_cal: 0.0
      L_N_cal: 0.0
      C_N_cal: 0.0
      delta_R_N:
        min: -0.02
        max: 0.02
      delta_L_N:
        min: -0.02
        max: 0.02
      delta_C_N:
        min: -0.02
        max: 0.02
      end_case_id: open_001
      C_end_cal: 0.0
      delta_C_end:
        min: -0.02
        max: 0.02

noise_cases:
  candidates:
    - noise_case_id: snr_50db
      weight: 0.20
      snr_db: 50
    - noise_case_id: snr_40db
      weight: 0.50
      snr_db: 40
    - noise_case_id: snr_30db
      weight: 0.25
      snr_db: 30
    - noise_case_id: snr_25db
      weight: 0.05
      snr_db: 25

validation:
  require_defects_field: true
  require_no_overlap: true
  require_x_end_consistency: true
  require_x_center_consistency: true
  require_defect_inside_cable: true