# UNet1D V2 训练配置
# 改进: 5级编码器 + ResBlock(空洞卷积) + CBAM + 增强下采样 + V3损失
experiment:
  name: unet1d_v2_medium
  seed: 42
  exp_dir: AgentsStorage/experiments

model:
  name: unet1d_v2
  base_ch: 48
  in_channels: 4
  out_channels: 1
  kernel_size: 7
  use_cbam: true

data:
  manifest: DataSet/manifest.yaml
  channels: [impulse, step]
  augment: true
  num_workers: 4
  pin_memory: true

train:
  epochs: 120
  batch_size: 64
  lr: 3.0e-4
  optimizer: adamw
  weight_decay: 5.0e-5
  scheduler: cosine_warm
  warmup_epochs: 10
  grad_clip: 1.0
  amp: true
  early_stop_patience: 15

loss:
  version: v3
  focal_gamma: 2.0
  alpha: 1.0
  peak_weight: 0.3
  smooth_weight: 0.05

device: cuda

eval:
  peak_tolerance_m: 2.0
  find_peaks_height: 0.2
  find_peaks_distance: 4
  find_peaks_prominence: 0.1
