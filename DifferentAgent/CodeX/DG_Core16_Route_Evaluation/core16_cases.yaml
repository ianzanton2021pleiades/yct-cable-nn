  algorithm2_chunk_size: 256
  distance_max_m: 60.0

measurement:
  seed: 20260902
  delay_ns: 1.35
  loss_db_at_100mhz: 0.12
  directivity: 0.0022
  source_match: 0.009
  tracking: 0.985
  tracking_phase_rad: 0.026
  noise_sigma: 0.0014
  noise_correlation: 0.965

routes:
  - dg_v3_rlgc
  - cst_v1_ladder_0p1m
  - cst_v1_continuous

cable:
